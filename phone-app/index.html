<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>R4 Remote</title>
  <meta name="description" content="Phone remote for an Arduino UNO R4 WiFi.">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="R4 Remote">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app" data-pin="unknown">
    <header class="bar">
      <div class="title">
        <span class="title-main">R4 Remote</span>
        <span class="title-sub" id="devName">—</span>
      </div>
      <button class="round" id="openSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="chips">
      <span class="chip" id="cloudChip"><i></i><span id="cloudText">Offline</span></span>
      <span class="chip" id="boardChip"><i></i><span id="boardText">Board unknown</span></span>
    </div>

    <main class="stage">
      <div class="rings" aria-hidden="true"><span></span><span></span><span></span></div>
      <button class="power" id="power" aria-label="Toggle pin D13" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M7.05 6.5a7.5 7.5 0 1 0 9.9 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <div class="big-state" id="bigState">—</div>
      <div class="sub-state" id="subState">Tap the gear to connect</div>
    </main>

    <section class="panel">
      <div class="quick">
        <button class="q q-on" id="qOn" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          On
        </button>
        <button class="q q-off" id="qOff" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          Off
        </button>
      </div>
      <div class="stats">
        <div><span class="k">Signal</span><span class="v" id="vSig">—</span></div>
        <div><span class="k">Uptime</span><span class="v" id="vUp">—</span></div>
        <div><span class="k">Last heard</span><span class="v" id="vSeen">—</span></div>
      </div>
      <p class="install-tip" id="installTip" hidden></p>
    </section>
  </div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <form class="sheet" id="sheet" aria-hidden="true">
    <div class="grabber"></div>
    <h2>Connect</h2>
    <p class="hint">Saved only on this phone.</p>
    <label>Broker host<input id="sHost" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
    <label>Device ID<input id="sDev" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
    <label>Username<input id="sUser" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label>Password<input id="sPass" type="password" autocomplete="current-password" required></label>
    <input id="sPort" type="hidden">
    <button class="primary" type="submit">Save &amp; connect</button>
    <button class="secondary" type="button" id="closeSheet">Close</button>
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="mqtt.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
