# Wokwi for VS Code: runs the compiled firmware on a simulated ESP32-S3.
# Create these files with Arduino IDE -> Sketch -> Export Compiled Binary (see ESP32/README.md).
[wokwi]
version = 1
firmware = 'build/esp32.esp32.esp32s3/esp32s3_led_mqtt.ino.merged.bin'
elf = 'build/esp32.esp32.esp32s3/esp32s3_led_mqtt.ino.elf'
